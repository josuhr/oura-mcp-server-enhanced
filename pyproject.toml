[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oura-mcp-server"
version = "0.1.0"
description = "MCP server for Oura Ring API v2"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.3.0",
    "httpx>=0.24.0",
]

[project.scripts]
oura-mcp-server = "oura_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp_server"]
